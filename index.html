<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #050505;
      color: #f5f5f5;

      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    /* Subtle background glow */
    body::before {
      content: "";
      position: fixed;
      width: 700px;
      height: 700px;

      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.07) 0%,
        rgba(255, 255, 255, 0) 70%
      );

      filter: blur(40px);
      pointer-events: none;
    }

    .container {
      text-align: center;
      padding: 40px;
      animation: reveal 1.2s cubic-bezier(.16,1,.3,1);
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.25em;
      color: #777;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(48px, 8vw, 110px);
      font-weight: 800;
      letter-spacing: -0.065em;
      line-height: 0.95;

      background: linear-gradient(
        120deg,
        #ffffff 20%,
        #888 50%,
        #ffffff 80%
      );

      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation: shine 5s linear infinite;
    }

    .line {
      width: 50px;
      height: 2px;
      background: #fff;
      margin: 32px auto;
      opacity: 0.5;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      letter-spacing: 0.02em;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 48px;
      }

      .container {
        padding: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="eyebrow">
      ACCESS GRANTED
    </div>

    <h1>
      WELCOME,<br>
      MOTHERFUCKERS.
    </h1>

    <div class="line"></div>

    <p class="subtitle">
      Now let's build something ridiculous.
    </p>

  </main>

</body>
</html>
